# Use these ingress rules in your existing remotely or locally managed tunnel.
ingress:
  - hostname: flights.example.com
    path: ^(/air(/.*)?|/\.well-known/oauth-authorization-server/air|/\.well-known/oauth-protected-resource/air/api/(v1|mcp))$
    service: http://127.0.0.1:3000
  - service: http_status:404
